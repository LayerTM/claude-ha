name: lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # requirements_test.txt is the single source of truth for the ruff version
      # (Dependabot updates it) and the pre-commit hook runs the installed ruff
      # rather than pinning its own. Assert a second pin has not crept back in --
      # while there were two, no ruff bump could ever be green.
      - name: Check ruff is pinned exactly once
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          req = pathlib.Path("requirements_test.txt").read_text()
          pre = pathlib.Path(".pre-commit-config.yaml").read_text()

          pinned = re.search(r"^ruff==(\S+)$", req, re.M)
          if pinned is None:
              sys.exit(
                  "requirements_test.txt no longer pins ruff -- has the format "
                  "changed?"
              )

          second = re.search(r"^\s*-\s*repo:\s*(\S*ruff\S*)\s*$", pre, re.M)
          if second is not None:
              sys.exit(
                  f"ruff is pinned twice: requirements_test.txt=={pinned.group(1)} "
                  f"and the pre-commit repo {second.group(1)}, which carries its own "
                  "rev. Run ruff from a `repo: local` hook instead, as mypy does, so "
                  "requirements_test.txt stays the only pin."
              )

          print(f"ruff pinned once: {pinned.group(1)}")
          PY

      - name: Install ruff
        run: pip install "$(grep -E '^ruff==' requirements_test.txt)"
      - name: Ruff (lint)
        run: ruff check custom_components tests scripts
      - name: Ruff (format)
        run: ruff format --check custom_components tests scripts
